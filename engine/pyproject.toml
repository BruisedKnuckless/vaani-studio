[project]
name = "vaani-engine"
version = "0.1.0"
description = "Local AI engine for Vaani Studio: speech enhancement, transcription, translation and dubbing."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pedalboard>=0.9.14",
    "pyloudnorm>=0.1.1",
    "noisereduce>=3.0",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
# Heavy local models that live in the core runtime. Models with conflicting
# torch/transformers pins (IndicTrans2, IndicF5, XTTS, Seed-VC) live in
# separate venvs under engine/runtimes/.
ml = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "demucs>=4.0.1",
    "deepfilternet>=0.5.6",
    "mlx-whisper>=0.4.2",
    "silero-vad>=5.1",
    "transformers>=4.46,<5",
    "onnxruntime>=1.20",
    "sentencepiece>=0.2",
    "IndicTransToolkit>=1.0",
    "mlx-lm>=0.20",
    "mlx-audio>=0.2.10",
    "setuptools<81",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
vaani = "vaani_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vaani_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
